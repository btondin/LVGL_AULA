CONFIG_MAIN_STACK_SIZE=16384
CONFIG_LOG=y

# Enable LVGL's internal logging system
CONFIG_LV_USE_LOG=y
# Only show warnings and errors (not verbose info/trace)
CONFIG_LV_LOG_LEVEL_WARN=y

CONFIG_LVGL=y
CONFIG_LV_Z_AUTO_INIT=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384

CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_SENSOR=y
CONFIG_EMUL=y

CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y

# SH1106/SSD1306 OLED driver
CONFIG_SSD1306=y

CONFIG_LV_FONT_MONTSERRAT_8=y
CONFIG_LV_FONT_UNSCII_8=y

CONFIG_CBPRINTF_FP_SUPPORT=y

# 1 bit per pixel (monochrome)
CONFIG_LV_COLOR_DEPTH_1=y

# Full screen buffer for monochrome display
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_FULL_REFRESH=y
